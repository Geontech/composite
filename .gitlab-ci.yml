# composite CI — build + test + sanitizers + public framework images.
#
# TOOLCHAIN POLICY. Every build/test job runs in the SAME environment the published images are
# built in: Rocky 9 + GCC Toolset 14, with nlohmann_json and opentelemetry-cpp at the exact
# commits the Dockerfile pins. That environment is literally the Dockerfile's `toolchain` stage,
# published to this project's registry by ci:toolchain below.
#
# It used to be Debian trixie (gcc:14) everywhere, which meant the gate tested a different
# compiler, a different libstdc++, a different glibc, and — once the images gained OpenTelemetry —
# a different opentelemetry-cpp (Debian's 1.19 vs the shipped 1.22). Components cross the DSO
# boundary as C++ objects and the ABI handshake cannot detect a mismatch, so testing an ABI we do
# not ship was the wrong risk to carry. Two jobs stay on Debian ON PURPOSE, marked as such:
# lint:tidy-format (pinned clang-format version) and the arm64 sanitizer, plus one explicit
# portability job so a newer GCC and a different distro's packaging still get exercised.

stages:
  - toolchain
  - lint
  - build
  - sanitize
  - publish

variables:
  # The CI toolchain image tag. BUMP THIS BY HAND when docker/Dockerfile.rocky9's toolchain stage
  # changes (compiler, cmake, or a pinned dependency revision) — same discipline as the base-image
  # digest and the nlohmann/otel commit pins, and auditable in the diff. ci:toolchain rebuilds only
  # when the tag is absent from the registry, so ordinary pipelines skip it in seconds.
  # The trailing segment is the first 12 hex of sha256(docker/Dockerfile.rocky9). ci:toolchain
  # RECOMPUTES it and fails if it disagrees, so a Dockerfile edit without a matching tag bump cannot
  # silently leave the pipeline testing an old toolchain while the release images use the new one.
  # The value is still literal because `image:` has to resolve before any script runs — the guard is
  # what makes the manual step safe rather than trusted.
  TOOLCHAIN_TAG: "rocky9-gcc14-1b23dbf3ef47"
  CI_TOOLCHAIN_IMAGE: "$CI_REGISTRY_IMAGE/ci-toolchain:$TOOLCHAIN_TAG"

# GCC 14 image; install cmake + git (FetchContent needs git) + nlohmann-json3-dev
# (nlohmann_json is a REQUIRED system dependency — the public JSON type in the
# property API — not a FetchContent fallback; trixie's 3.11.3 meets the floor).
.gcc:
  image: gcc:14
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake git nlohmann-json3-dev
    - cmake --version && g++ --version | head -1

# Docker-in-Docker is isolated to the image jobs. These jobs are deliberately
# untagged: the project's default runners already permit the pinned dind service
# to run privileged and share its TLS client certificates. If that ever stops
# being true the jobs fail at `docker version` rather than routing elsewhere, so
# add a `tags:` entry pointing at a privileged runner instead of relaxing this.
# Keep the client and daemon versions identical to avoid API drift.
.docker:
  image: docker:29.1.3-cli
  services:
    - name: docker:29.1.3-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    # The self-managed runner injects its own DOCKER_AUTH_CONFIG with a
    # credsStore entry so it can pull the job/service images. Docker CLI 29
    # also consumes this variable, but its stricter parser only accepts inline
    # auths and aborts Buildx sessions on the runner's credsStore field. The
    # runner has finished pulling images before this shell starts; normal image
    # builds need no credentials, and publish:dockerhub authenticates below
    # with docker login (which writes the job-local config.json).
    - unset DOCKER_AUTH_CONFIG
    - docker version
    # Materialize the TLS endpoint supplied through DOCKER_* and select that
    # context. Every Docker context has an automatic Buildx builder backed by
    # the daemon's integrated BuildKit. Do not create a docker-container builder
    # here: that adds a nested executor inside dind, which is the boundary where
    # this runner exits before evaluating the Dockerfile (reported at line 1).
    - docker context create composite-dind
    - export DOCKER_CONTEXT=composite-dind
    - docker buildx inspect --bootstrap

# The primary build/test environment: the same image the release artifacts are built in. No
# package installation at all — cmake, ninja, git, GCC Toolset 14, nlohmann_json and
# opentelemetry-cpp are baked in, which is also what removes "which opentelemetry does this job
# get?" as a question rather than answering it.
.rocky:
  image: $CI_TOOLCHAIN_IMAGE
  before_script:
    - cmake --version | head -1
    - g++ --version | head -1

# Everything except publish:dockerhub is a *verification* job, and a tag pipeline verifies a commit
# develop already verified. Re-running them on the tag would rebuild and re-test identical source to
# reach the same answer, then publish images built by that second run rather than the ones develop
# blessed — which is the thing promote-by-digest exists to avoid. So a tag pipeline is publish-only.
# Jobs opt in by extending this alongside their image anchor, e.g. `extends: [.rocky, .not-on-tag]`.
.not-on-tag:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Publish the Dockerfile's toolchain stage to THIS PROJECT's registry so every build/test job can
# use it. Pushed with $CI_JOB_TOKEN, which is scoped to this project's registry — no long-lived
# credential, and deliberately not Docker Hub, which is for release artifacts only.
#
# IDEMPOTENT: if $TOOLCHAIN_TAG already exists the job exits immediately. Only a deliberate tag
# bump pays for the opentelemetry-cpp source build, so the common pipeline cost is one manifest
# lookup.
# ---------------------------------------------------------------------------
ci:toolchain:
  stage: toolchain
  extends: [.docker, .not-on-tag]
  script:
    - printf '%s' "$CI_JOB_TOKEN" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # GUARD FIRST: the tag must encode the current Dockerfile. Without this, skipping the rebuild
    # when the tag exists means any Dockerfile change — a compiler bump, a new dependency pin —
    # keeps the pipeline on a stale toolchain while docker/Dockerfile.rocky9 (and therefore every
    # released image) moves on. That is precisely the tested-vs-shipped divergence this whole
    # restructure exists to remove, so it fails loudly and tells you the tag to write.
    - |
      set -eu
      want="$(sha256sum docker/Dockerfile.rocky9 | cut -c1-12)"
      case "$TOOLCHAIN_TAG" in
        *"$want") echo "TOOLCHAIN_TAG matches docker/Dockerfile.rocky9 ($want)" ;;
        *)
          echo "TOOLCHAIN_TAG is stale."
          echo "  docker/Dockerfile.rocky9 hashes to: $want"
          echo "  TOOLCHAIN_TAG is:                   $TOOLCHAIN_TAG"
          echo "Set TOOLCHAIN_TAG in .gitlab-ci.yml to something ending in '$want'"
          echo "(convention: rocky9-gcc<major>-$want) so CI tests the toolchain the images ship."
          exit 1
          ;;
      esac
    - |
      if docker manifest inspect "$CI_TOOLCHAIN_IMAGE" >/dev/null 2>&1; then
        echo "$CI_TOOLCHAIN_IMAGE already present; nothing to build"
        exit 0
      fi
      echo "building $CI_TOOLCHAIN_IMAGE"
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target toolchain
      --tag "$CI_TOOLCHAIN_IMAGE"
      --push
      .
    - docker buildx imagetools inspect "$CI_TOOLCHAIN_IMAGE"
  after_script:
    - unset DOCKER_AUTH_CONFIG
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

# ---------------------------------------------------------------------------
# Static analysis / formatting.
#
# ADVISORY BY DESIGN — not an RC2-STOPGAP. Style drift should never hold a pipeline hostage:
# the job still runs everything and still FAILS (shows orange) when findings exist, but
# allow_failure keeps the pipeline green and the full tool output is kept as artifacts
# (lint-format.log / lint-tidy.log) so drift can be turned into cleanup issues on its own
# schedule instead of blocking whoever happens to push next. Both tools run to completion —
# a format violation no longer hides the tidy findings behind an early exit, and vice versa.
#
# DELIBERATELY still Debian, unlike the build/test jobs. clang-format output is version-specific:
# Rocky 9 ships clang-tools-extra 21 against trixie's 19, and moving would reformat the entire tree
# for no functional reason. This job cares about the formatter version, not the ABI.
# clang-tidy surfaces findings as warnings (WarningsAsErrors is still empty);
# tighten it once the outstanding findings are burned down.
# ---------------------------------------------------------------------------
lint:tidy-format:
  stage: lint
  extends: .not-on-tag
  image: gcc:14
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake git clang-tidy clang-format nlohmann-json3-dev
  script:
    # tee captures each tool's output for the artifacts; pipefail keeps the tool's exit status
    # visible through the pipe so `rc` records it (default bash would report tee's).
    - set -o pipefail
    - rc=0
    # compile_commands.json drives clang-tidy.
    - cmake -B build -DCOMPOSITE_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build -j"$(nproc)" --target composite >/dev/null   # generate version.hpp etc.
    # clang-tidy every compiled source (recursively); each TU pulls its headers, so the whole
    # tree's headers are analyzed transitively — including properties/ports/buffers, which the old
    # 'include/composite/core/*.hpp' glob excluded. `find` (not `git ls-files`) so untracked files
    # are covered too (much of the tree is currently uncommitted; git ls-files would skip it).
    - clang-tidy -p build $(find src -name '*.cpp') 2>&1 | tee lint-tidy.log || rc=1
    # clang-format compliance across the whole tree (again `find`, recursive, untracked-visible).
    - clang-format --dry-run --Werror $(find include src test bench examples -name '*.hpp' -o -name '*.cpp' 2>/dev/null) 2>&1 | tee lint-format.log || rc=1
    - exit $rc
  artifacts:
    when: always
    paths:
      - lint-tidy.log
      - lint-format.log
    expire_in: 30 days

# ---------------------------------------------------------------------------
# Build the library + CLI with the unit tests on, and run ctest.
# ---------------------------------------------------------------------------
build:test:
  stage: build
  extends: [.rocky, .not-on-tag]
  script:
    # `ci` preset = Debug + tests + COMPOSITE_WERROR=ON: the tree is warning-clean
    # under -Wall -Wextra -Wpedantic, so warnings now fail the gate. ctest runs the
    # full 34-test suite (incl. the formerly-orphaned concurrency tests).
    - cmake --preset ci
    - cmake --build --preset ci -j"$(nproc)"
    - ctest --preset ci

# Build the documented option combinations so the optional-feature paths
# (OpenSSL / OpenTelemetry, etc.) don't rot. DPDK is its own job below (it pulls
# libdpdk via pkg-config, which the base gcc image doesn't carry).
# Optional-feature matrix. No package installation: OpenTelemetry and OpenSSL are already in the
# toolchain image, at the same pins the published images use. This job used to apt-install Debian's
# opentelemetry-cpp-dev (1.19) while the images shipped 1.22 — testing one version and releasing
# another. Now there is only one.
build:options-matrix:
  stage: build
  extends: [.rocky, .not-on-tag]
  parallel:
    matrix:
      - OPTS: "-DCOMPOSITE_USE_OPENSSL=ON"
      - OPTS: "-DCOMPOSITE_USE_OPENTELEMETRY=ON"
      # The OTel bridge SANITIZED, under BOTH sanitizers. The sanitize:* jobs below build the
      # default option set, which excludes OpenTelemetry, so without these entries the most
      # sanitizer-hungry code in the tree — raw void* round-trips, a `this` pointer handed to a C
      # callback the SDK invokes from its own export thread, and cross-thread mutation of a group's
      # series list — ran under no sanitizer at all, in any job.
      #
      # TSan is not redundant with ASan here: what this code gets wrong is ORDERING (an export
      # callback racing a registration or a deregistration), and ASan only sees it once the race
      # has already produced a bad access. The registry/telemetry defects this suite exists to
      # catch were all races first and use-after-frees second.
      - OPTS: "-DCOMPOSITE_USE_OPENTELEMETRY=ON -DCOMPOSITE_SANITIZER=address,undefined"
      - OPTS: "-DCOMPOSITE_USE_OPENTELEMETRY=ON -DCOMPOSITE_SANITIZER=thread"
  script:
    # Tests ON so the option-specific suites are built AND RUN. The OTLP grouping test in
    # particular only exists under -DCOMPOSITE_USE_OPENTELEMETRY=ON, and the failure it guards
    # against (N components collapsing into one exported series) compiles perfectly happily —
    # building without running would not catch it.
    - cmake -B build $OPTS -DCOMPOSITE_BUILD_TESTS=ON
    - cmake --build build -j"$(nproc)"
    - ctest --test-dir build --output-on-failure

# DPDK feature build. dpdk_manager.cpp ONLY compiles under -DCOMPOSITE_USE_DPDK=ON
# (it includes rte_*.h), so it is invisible to every other job and to local dev
# environments without libdpdk. This is the ONLY gate that compile-checks it — the
# EAL-free bookkeeping/locking it delegates to (port_registry) is already unit- and
# TSan-tested in build:test / sanitize:* without a NIC, so this job only needs to
# COMPILE the EAL adapter, not run it (no NIC in CI). pkg_check_modules(libdpdk)
# resolves against libdpdk-dev's pkg-config file (installed below), so this gate is
# mandatory — the manager can't silently rot.
build:dpdk:
  stage: build
  extends: [.rocky, .not-on-tag]
  before_script:
    # dpdk-devel is the ONE package any job still installs: it is a fast dnf install from
    # appstream, and keeping it out of the shared toolchain image avoids paying ~40MB of drivers
    # on every other job. Same package the -dpdk images use.
    - microdnf install -y --enablerepo=crb dpdk-devel
    - cmake --version | head -1 && pkg-config --modversion libdpdk
  script:
    # Build the library (which now contains dpdk_manager.cpp) + the CLI. Tests off:
    # the DPDK paths need a NIC/hugepages to run; compile coverage is the goal here.
    - cmake -B build -DCOMPOSITE_USE_DPDK=ON -DCOMPOSITE_BUILD_TESTS=OFF -DCOMPOSITE_WERROR=ON
    - cmake --build build -j"$(nproc)"

# PORTABILITY, not the gate. The gating jobs run Rocky 9 + GCC Toolset 14 because that is what
# ships; this one keeps a newer compiler (trixie's GCC 14.4 vs Rocky's 14.2.1) and a completely
# different distro's packaging of nlohmann_json in the picture, so a change that only compiles
# against one toolchain still gets caught. Default options: the optional features are covered by
# build:options-matrix on the shipped toolchain.
build:portability-debian:
  stage: build
  extends: [.gcc, .not-on-tag]
  script:
    - cmake -B build -DCOMPOSITE_BUILD_TESTS=ON -DCOMPOSITE_WERROR=ON
    - cmake --build build -j"$(nproc)"
    - ctest --test-dir build --output-on-failure

# Scheduled benchmark run (Baseline-0). INFORMATIONAL — it uploads the JSON artifacts and
# never gates a merge request: tolerance bands stay advisory until this runner's variance is
# characterized against the committed baselines in benchmarks/baselines/. Runs from schedules
# (and manually from the web UI), in Release: Debug or sanitized numbers are not baselines.
# Comparisons are only meaningful between artifacts with the same schema_version and a
# comparable "meta" block (CPU model, governor, runner) — the artifact records all of it.
bench:baseline:
  stage: build
  extends: [.rocky]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  script:
    - cmake --preset release
    - cmake --build build/release --target bench_datapath bench_registry -j"$(nproc)"
    - mkdir -p bench-results
    - ./build/release/test/bench_datapath --reps 5 --json bench-results/datapath.json
        --framework-commit "$CI_COMMIT_SHA" --harness-commit "$CI_COMMIT_SHA"
    - ./build/release/test/bench_registry --reps 5 --json bench-results/registry.json
        --framework-commit "$CI_COMMIT_SHA" --harness-commit "$CI_COMMIT_SHA"
    # A benchmark of a build with assertions live (or unoptimized) is not a baseline — the
    # first capture shipped exactly that, and only its own metadata caught it. Fail the job
    # rather than upload misleading numbers.
    - grep -q '"assertions"[:] "disabled"' bench-results/datapath.json
    - grep -q '"optimized"[:] true' bench-results/datapath.json
    - grep -q '"assertions"[:] "disabled"' bench-results/registry.json
    - grep -q '"optimized"[:] true' bench-results/registry.json
  artifacts:
    paths: [bench-results/]
    expire_in: 90 days

# Install the package and build a downstream consumer against it via
# find_package(composite). Guards the install/export/pkg-config surface: asserts
# the generated version.hpp installs and the .pc declares Libs: (both were broken
# before the packaging fixes — a $<BUILD_INTERFACE:> in install() and a missing
# Libs: line).
build:consumer:
  stage: build
  extends: [.rocky, .not-on-tag]
  script:
    - cmake -B build -DCMAKE_INSTALL_PREFIX=$CI_PROJECT_DIR/_install -DCOMPOSITE_INSTALL=ON -DCOMPOSITE_BUILD_TESTS=OFF
    - cmake --build build -j"$(nproc)" --target install
    - test -f _install/include/composite/version.hpp        # generated header must install
    # composite.pc installs to ${CMAKE_INSTALL_LIBDIR}/pkgconfig (lib or lib64, distro-dependent),
    # not share/pkgconfig — locate it instead of hardcoding the libdir.
    - grep -q '^Libs:' "$(find _install -name composite.pc)" # .pc must declare Libs
    - mkdir -p consumer
    - |
      cat > consumer/main.cpp <<'EOF'
      // Include the umbrella header (pulls component.hpp etc.) to ENFORCE self-containment:
      // the installed package must compile against a clean consumer with no spdlog on the
      // include path (spdlog is private behind composite::logger; nlohmann_json is a public
      // find_dependency). A subclass + logger() exercise the logging facade end to end.
      #include <composite/composite.hpp>
      namespace {
      class ci_probe : public composite::component {
      public:
          explicit ci_probe(std::string_view id) : composite::component(id) {}
          auto process() -> composite::retval override { logger()->info("ci {}", id()); return composite::retval::FINISH; }
      };
      }
      int main() {
          composite::set_global_log_level(composite::log_level::off);
          auto& r = composite::metrics::registry::instance();
          r.get_or_create_counter("ci.consumer", "demo", "1", {}).inc();
          ci_probe p{"ci_consumer"};
          return 0;
      }
      EOF
    - |
      cat > consumer/CMakeLists.txt <<'EOF'
      cmake_minimum_required(VERSION 3.16)
      project(consumer CXX)
      set(CMAKE_CXX_STANDARD 20)
      find_package(composite REQUIRED)
      add_executable(consumer main.cpp)
      target_link_libraries(consumer PRIVATE composite::composite)
      EOF
    - cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install
    - cmake --build consumer/build
    - LD_LIBRARY_PATH=$CI_PROJECT_DIR/_install/lib consumer/build/consumer
    # Build the in-repo example component against the install so the README's "Implementing a
    # Component" walkthrough stays compilable (it is the same source as examples/passthrough_gain).
    - cmake -S examples/passthrough_gain -B examples/passthrough_gain/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install
    - cmake --build examples/passthrough_gain/build
    - test -f "$(find examples/passthrough_gain/build -name 'libpassthrough_gain.so')"  # MODULE .so built

# Build, exercise, and STAGE both public framework image roles. This job never receives Docker
# Hub credentials — publication is the release job's job — but it does push the verified,
# attested artifacts to THIS PROJECT's registry with $CI_JOB_TOKEN, because the release job
# promotes them by digest rather than rebuilding. The CI-only targets validate an installed SDK
# consumer and graceful signal handling without adding test assets to runtime.
build:container:
  stage: build
  extends: [.docker, .not-on-tag]
  script:
    - export IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    # LABEL CONTRACT: image labels carry the numeric PROJECT version, which is also what
    # `composite-cli --version` reports. Release identity — including any `-rc.N` — lives in the
    # TAG, not in the labels.
    #
    # That is forced by promote-by-digest: labels are baked into the image config at build time,
    # here on develop, where the eventual release tag does not exist yet. The alternative is a
    # relabel build at promote time, which produces a new config and therefore regenerates the
    # provenance/SBOM attestations to describe the relabel rather than the real build — trading
    # accurate supply-chain metadata for a cosmetic string. For final releases the two coincide
    # anyway (publish asserts RELEASE_BASE_VERSION == PROJECT_VERSION); the divergence is only the
    # `-rc.N` suffix on prereleases.
    - export IMAGE_VERSION="$(sed -n 's/^project(composite VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
    - test -n "$IMAGE_VERSION"
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-runtime
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-devel
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel-smoke
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-devel-smoke
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime-smoke
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-runtime-smoke
      --load
      .
    - test "$(docker image inspect --format '{{.Config.User}}' composite:ci-runtime)" = "10001:10001"
    - test "$(docker run --rm composite:ci-runtime --version)" = "$IMAGE_VERSION"
    # The Rocky base's own labels are inherited and can only be overwritten, so
    # assert the restated values survive on both roles — an unnoticed base-image
    # bump reintroducing `license=BSD-3-Clause` would misdescribe an LGPL image.
    - |
      set -eu
      for role in runtime devel; do
        img="composite:ci-$role"
        test "$(docker image inspect --format '{{index .Config.Labels "license"}}' "$img")" = "LGPL-3.0-or-later"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$img")" = "LGPL-3.0-or-later"
        test "$(docker image inspect --format '{{index .Config.Labels "vendor"}}' "$img")" = "Geon Technologies, LLC"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.vendor"}}' "$img")" = "Geon Technologies, LLC"
        test "$(docker image inspect --format '{{index .Config.Labels "version"}}' "$img")" = "$IMAGE_VERSION"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$img")" = "$IMAGE_VERSION"
        # $IMAGE_VERSION here IS the project version (see the label contract above), so this also
        # pins that the labels never drift from what composite-cli reports.
      done
    # Both images redistribute the header-only dependencies' code, so their MIT
    # notices must ship with them.
    - |
      set -eu
      for role in runtime devel; do
        docker run --rm --entrypoint /bin/bash "composite:ci-$role" -c '
          set -eu
          for dep in argparse cpp-httplib spdlog nlohmann_json; do
            ls /usr/share/licenses/composite/third-party/"$dep"/* >/dev/null
          done
          test -s /usr/share/licenses/composite/LICENSE'
      done
    - docker run --rm --entrypoint /bin/bash composite:ci-runtime -c 'test "$(id -u)" = 10001; ! command -v cmake; ! command -v g++; test ! -e /usr/local/include/composite'
    - docker run --rm composite:ci-devel cmake --version
    - docker run --rm composite:ci-devel /bin/bash -c 'test "$(id -u)" = 10001; test -f /usr/local/include/composite/composite.hpp; test -f /usr/local/share/composite/cmake/compositeConfig.cmake'
    - docker run --rm composite:ci-devel-smoke /bin/true
    # Capability assertions. The published 0.5.0-rc.1 images had OpenTelemetry, DPDK and TLS all
    # compiled out and still passed every check here, because --version cannot tell the difference.
    # These assert the FEATURE SURFACE, which is the thing that was actually wrong.
    - |
      set -eu
      for role in runtime devel; do
        feats="$(docker run --rm --entrypoint /usr/local/bin/composite-cli "composite:ci-$role" --features | sort | tr '\n' ',')"
        test "$feats" = "openssl,opentelemetry," || { echo "unexpected features for $role: [$feats]"; exit 1; }
      done
    # The DPDK variant is a real published artifact, so it is BUILT AND EXERCISED here rather than
    # only compile-checked natively (build:dpdk). Otherwise the first time anyone builds the image
    # people actually pull is during a release.
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime-smoke
      --build-arg BUILD_TOOLCHAIN=toolchain-dpdk
      --build-arg COMPOSITE_WITH_DPDK=ON
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-runtime-dpdk-smoke
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel-smoke
      --build-arg BUILD_TOOLCHAIN=toolchain-dpdk
      --build-arg COMPOSITE_WITH_DPDK=ON
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-devel-dpdk-smoke
      --load
      .
    - |
      set -eu
      feats="$(docker run --rm --entrypoint /usr/local/bin/composite-cli composite:ci-runtime-dpdk-smoke --features | sort | tr '\n' ',')"
      test "$feats" = "dpdk,openssl,opentelemetry," || { echo "unexpected DPDK features: [$feats]"; exit 1; }
    # --list-dpdk-ports only exists when DPDK is compiled in, so this is a second, independent
    # witness that the option really took effect. It is expected to find no ports on a CI runner
    # with no bound NIC; what matters is that the flag is recognised rather than rejected.
    - docker run --rm composite:ci-runtime-dpdk-smoke --help | grep -q -- --list-dpdk-ports
    # The smoke images above are supersets — runtime-smoke adds a graph config, devel-smoke adds an
    # example component and the feature-check script — so they are for VERIFICATION only and must
    # never be published. Build the shippable targets too; they share every layer below the smoke
    # additions, so the marginal cost is a manifest.
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime
      --build-arg BUILD_TOOLCHAIN=toolchain-dpdk
      --build-arg COMPOSITE_WITH_DPDK=ON
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-runtime-dpdk
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel
      --build-arg BUILD_TOOLCHAIN=toolchain-dpdk
      --build-arg COMPOSITE_WITH_DPDK=ON
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-devel-dpdk
      --load
      .
    # Guard against ever staging a smoke image: the release artifacts must NOT contain test assets.
    - |
      set -eu
      for img in composite:ci-runtime composite:ci-runtime-dpdk; do
        docker run --rm --entrypoint /bin/sh "$img" -c '! test -e /config/smoke.json' \
          || { echo "$img contains smoke assets — refusing to stage"; exit 1; }
      done
      for img in composite:ci-devel composite:ci-devel-dpdk; do
        docker run --rm --entrypoint /bin/sh "$img" -c '! test -e /tmp/check-features.sh' \
          || { echo "$img contains smoke assets — refusing to stage"; exit 1; }
      done
    # STARTUP + SIGNAL HANDLING. In `script`, and BEFORE anything is pushed: a failure here must
    # fail the job and must prevent staging. This block previously sat in an after_script, where
    # GitLab does not fail the job on error — so it never gated anything, and an earlier revision of
    # this change then discarded it entirely by declaring a second after_script key (last-key-wins,
    # and both keys are valid YAML, so nothing complains).
    - docker run --detach --name composite-runtime-smoke composite:ci-runtime-smoke
    - |
      ready=0
      for attempt in $(seq 1 40); do
        if docker logs composite-runtime-smoke 2>&1 | grep -q 'REST server listening'; then
          ready=1
          break
        fi
        sleep 0.25
      done
      test "$ready" = 1
    - docker kill --signal TERM composite-runtime-smoke
    - test "$(docker wait composite-runtime-smoke)" = 0
    - docker rm -f composite-runtime-smoke

    # STAGE THE BLESSED ARTIFACTS — built again, deliberately, with attestations and pushed
    # straight to the registry.
    #
    # The images verified above were produced with --load, which cannot carry provenance or SBOM
    # attestations: those are sibling manifests in an image index and require the registry
    # exporter. Tagging and pushing a --load image would therefore have staged artifacts with no
    # supply-chain metadata at all, silently dropping what docker/README.md documents and what the
    # release job is supposed to promote. So the shippable tags are built with the same inputs and
    # --push, and then PULLED BACK so the verification below runs against the exact manifest the
    # release job will promote rather than a local look-alike.
    #
    # The rebuild is nearly free: every layer is already in the builder cache from the passes above.
    - printf '%s' "$CI_JOB_TOKEN" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export STAGED="$CI_REGISTRY_IMAGE/staging"
    # Pipeline-scoped, and used for every reference within this job. A bare `staging:<sha>` is
    # mutable — a concurrent pipeline or a retry on the same commit rewrites it — so building under
    # one name and verifying under it need not be the same bytes. The pipeline id makes this job's
    # artifacts its own for the duration of its own gates; the commit-scoped alias published at the
    # end is what the tag pipeline later promotes.
    - export STAGE_REF="$CI_COMMIT_SHA-p$CI_PIPELINE_ID"
    - |
      set -eu
      # target : tag suffix : extra build args
      printf '%s\n' \
        "runtime|:|" \
        "devel|:-devel|" \
        "runtime|:-dpdk|--build-arg BUILD_TOOLCHAIN=toolchain-dpdk --build-arg COMPOSITE_WITH_DPDK=ON" \
        "devel|:-dpdk-devel|--build-arg BUILD_TOOLCHAIN=toolchain-dpdk --build-arg COMPOSITE_WITH_DPDK=ON" \
      | while IFS='|' read -r target suffix extra; do
          suffix="${suffix#:}"
          # shellcheck disable=SC2086
          docker buildx build \
            --file docker/Dockerfile.rocky9 \
            --platform linux/amd64 \
            --target "$target" \
            $extra \
            --build-arg IMAGE_CREATED="$IMAGE_CREATED" \
            --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" \
            --build-arg IMAGE_VERSION="$IMAGE_VERSION" \
            --build-arg IMAGE_SOURCE="$CI_PROJECT_URL" \
            --tag "$STAGED:$STAGE_REF$suffix" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .
        done
    # Verify the STAGED artifacts, not local copies: pull each back and re-check the feature
    # surface. This is the manifest the release job promotes, so it is the one that has to be right.
    - |
      set -eu
      for spec in ":openssl,opentelemetry," "-devel:openssl,opentelemetry," "-dpdk:dpdk,openssl,opentelemetry," "-dpdk-devel:dpdk,openssl,opentelemetry,"; do
        suffix="${spec%%:*}"
        want="${spec#*:}"
        img="$STAGED:$STAGE_REF$suffix"
        docker pull "$img"
        got="$(docker run --rm --entrypoint /usr/local/bin/composite-cli "$img" --features | sort | tr '\n' ',')"
        test "$got" = "$want" || { echo "staged $img features wrong: got [$got] want [$want]"; exit 1; }
        # A shippable image must never contain the smoke fixtures.
        docker run --rm --entrypoint /bin/sh "$img" -c '! test -e /config/smoke.json && ! test -e /tmp/check-features.sh' \
          || { echo "staged $img contains smoke assets"; exit 1; }
      done
    # Attestations must actually be present, or the release job promotes nothing to carry forward.
    #
    # `grep -q .` is NOT good enough and was the first thing written here: buildx prints the literal
    # string `null` when an attestation is absent, and `null` is four characters, so the check passed
    # on exactly the images it existed to reject. Require non-empty AND not-null, for BOTH fields —
    # SBOM was not checked at all.
    - |
      set -eu
      attested() {  # attested <image> <field>
        val="$(docker buildx imagetools inspect "$1" --format "{{json .$2}}" 2>/dev/null || true)"
        val="$(printf '%s' "$val" | tr -d '[:space:]')"
        test -n "$val" && test "$val" != "null" && test "$val" != "{}" && test "$val" != "[]"
      }
      for suffix in "" "-devel" "-dpdk" "-dpdk-devel"; do
        img="$STAGED:$STAGE_REF$suffix"
        attested "$img" Provenance || { echo "no provenance attestation on $img"; exit 1; }
        attested "$img" SBOM       || { echo "no SBOM attestation on $img"; exit 1; }
        echo "attested: $img"
      done
    # Last step, and only now that every gate above has passed: point a commit-scoped alias at these
    # exact manifests. This is the handle the tag pipeline promotes from.
    #
    # It needs its own name because a tag pipeline cannot compute $STAGE_REF: the commit is the same
    # but $CI_PIPELINE_ID is that pipeline's own, so the pipeline-scoped tag it would look for
    # belongs to no build. Publishing under the commit alone gives the tag pipeline something it can
    # name from $CI_COMMIT_SHA, which is all it has.
    #
    # `imagetools create` copies the manifest list by reference — no rebuild, no layer re-upload, and
    # the digest is unchanged, so the attestations verified above are the ones the alias resolves to.
    #
    # The alias is mutable (a later pipeline on the same commit moves it) and that is fine: publish
    # resolves it to a digest once, up front, and works from the digest thereafter. What matters is
    # that it can only ever point at a build that cleared this job's smoke, feature and attestation
    # gates, because this is the last thing the job does.
    - |
      set -eu
      for suffix in "" "-devel" "-dpdk" "-dpdk-devel"; do
        docker buildx imagetools create \
          --tag "$STAGED:$CI_COMMIT_SHA$suffix" \
          "$STAGED:$STAGE_REF$suffix"
        echo "aliased $STAGED:$STAGE_REF$suffix -> $STAGED:$CI_COMMIT_SHA$suffix"
      done
  after_script:
    # ONE after_script, cleanup only. Nothing here is a test: GitLab does not fail a job when
    # after_script fails, so anything that must gate belongs in `script`.
    - unset DOCKER_AUTH_CONFIG
    - docker rm -f composite-runtime-smoke 2>/dev/null || true
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

# Build the sibling composite-comps fleet against the freshly-installed framework
# and run its integration tests — the cross-repo exit gate: the framework does not
# ship an API the fleet cannot build and pass against. Defaults
# to a sibling project in the same group; allow_failure only until the repo's CI
# access is provisioned (the build itself is green).
build:comps:
  stage: build
  extends: [.rocky, .not-on-tag]
  allow_failure: true   # pending comps-repo CI access; the build + tests are green locally
  variables:
    COMPS_REPO_URL: "$CI_SERVER_URL/$CI_PROJECT_NAMESPACE/composite-comps.git"
  script:
    - cmake -B build -DCMAKE_INSTALL_PREFIX=$CI_PROJECT_DIR/_install -DCOMPOSITE_INSTALL=ON -DCOMPOSITE_BUILD_TESTS=OFF
    - cmake --build build -j"$(nproc)" --target install
    - git clone --depth 1 "$COMPS_REPO_URL" comps_src
    - cmake -S comps_src -B comps_src/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install -DBUILD_TESTING=ON
    - cmake --build comps_src/build -j"$(nproc)"                       # all 5 component .so
    - cmake --build comps_src/build --target framer_integration_tests  # fleet integration test
    - ctest --test-dir comps_src/build -R framer_integration --output-on-failure
    - cmake -S comps_src -B comps_src/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install

# ---------------------------------------------------------------------------
# Sanitizer gate for the concurrency core + buffers.
#
# These now drive the CMake `tsan` / `asan-ubsan` presets — a single source of
# truth shared with local dev (`cmake --preset tsan && ctest --preset tsan`).
# The presets apply -fsanitize at directory scope, so the WHOLE registered
# suite is instrumented (the 13 formerly-orphaned standalone tests are now
# proper CMake targets), not just a hand-picked set of g++ one-liners. The test
# presets carry the TSAN_OPTIONS/UBSAN_OPTIONS halt_on_error settings.
# ---------------------------------------------------------------------------
sanitize:thread:
  stage: sanitize
  extends: [.rocky, .not-on-tag]
  script:
    - cmake --preset tsan
    - cmake --build --preset tsan -j"$(nproc)"
    # Concurrency core + ports + lifecycle + standalone suite. The httplib-based
    # integration test is excluded until httplib itself is confirmed TSan-clean
    # (third-party); drop the -E to include it once verified.
    - ctest --preset tsan -E TestHttpIntegration

sanitize:address:
  stage: sanitize
  extends: [.rocky, .not-on-tag]
  script:
    - cmake --preset asan-ubsan
    - cmake --build --preset asan-ubsan -j"$(nproc)"
    - ctest --preset asan-ubsan

# Weak-memory (ARM) run: x86 TSO hides the visibility bugs the park happens-before chain guards
# against, so this is the only job that could surface an ordering bug in park.hpp.
#
# Off unless ARM64_RUNNER is set to "true" as a project CI/CD variable, because `tags: [arm64]`
# with no arm64 runner does not fail — it leaves the job pending until it times out, which holds
# the whole pipeline open and reports "stuck because ... no runners that match all of the job's
# tags". allow_failure does not help: it governs a job that ran and failed, not one that never
# started. Skipping it outright is the only state that neither blocks nor lies about coverage.
#
# The variable is deliberately not given a default here, so enabling it is one project setting and
# there is no precedence question between this file and the project's own variables.
#
# Still Debian on purpose: the CI toolchain image is amd64-only, so this keeps the multi-arch
# gcc:14. When a runner is wired up, set the variable and expect real failures at first.
sanitize:thread-arm64:
  stage: sanitize
  extends: .gcc
  tags: [arm64]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $ARM64_RUNNER != "true"
      when: never
    - when: on_success
  script:
    - cmake --preset tsan
    - cmake --build --preset tsan -j"$(nproc)"
    - ctest --preset tsan -E TestHttpIntegration

# Build each release image once, push it under its source-SHA tag with SBOM and
# max provenance, test the registry-resolved artifacts, then promote those same
# manifests to SemVer aliases. This is initially manual even on a protected
# release tag; the protected environment supplies the approval/audit boundary.
publish:dockerhub:
  stage: publish
  extends: .docker
  resource_group: dockerhub-composite
  environment:
    name: dockerhub-production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
      when: manual
    - when: never
  script:
    - test -n "$DOCKERHUB_NAMESPACE"
    - test -n "$DOCKERHUB_LOGIN"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DOCKERHUB_REPOSITORY"
    - export IMAGE_NAME="$DOCKERHUB_NAMESPACE/$DOCKERHUB_REPOSITORY"
    - export IMAGE_VERSION="${CI_COMMIT_TAG#v}"
    - export PROJECT_VERSION="$(sed -n 's/^project(composite VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
    # An RC image keeps its full prerelease tag, while CMake and composite-cli
    # report the underlying numeric project version.
    - export RELEASE_BASE_VERSION="${IMAGE_VERSION%%-rc.*}"
    - test "$RELEASE_BASE_VERSION" = "$PROJECT_VERSION"
    - export IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - export RUNTIME_SHA_TAG="$IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA"
    - export DEVEL_SHA_TAG="$IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA-devel"
    # DPDK variants: separate images because a DPDK build imposes host requirements (hugepages,
    # VFIO/UIO devices, elevated capabilities) that no non-DPDK deployment should inherit.
    # See docker/README.md.
    - export RUNTIME_DPDK_SHA_TAG="$IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA-dpdk"
    - export DEVEL_DPDK_SHA_TAG="$IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA-dpdk-devel"
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_LOGIN" --password-stdin
    # NOTE: the external-image preflight that used to live here is gone with the builds. It pulled
    # the Dockerfile's syntax frontend and base image to turn a Docker Hub credential-scope problem
    # ("insufficient scopes" on public images, because Docker picks credentials per registry HOST
    # rather than per repository) into a fast, clearly-named failure. That failure mode now belongs
    # to build:container, which is where the building happens — and which never logs in to Docker
    # Hub, so it pulls those images anonymously and cannot hit it at all.
    # PROMOTE, DO NOT REBUILD. These images were built, smoke-tested and capability-checked by
    # build:container on this exact commit, then staged in this project's registry. Rebuilding here
    # would publish an artifact nobody tested — and, now that opentelemetry-cpp is built from
    # source, would pay for four source builds in a fresh dind with no layer cache.
    #
    # It also removes the external-image preflight that used to live here: nothing in this job pulls
    # the Dockerfile's syntax frontend or base image any more, because this job no longer builds.
    # That whole credential-scope failure mode belongs to build:container now.
    #
    # If the staged tags are absent, the tagged commit's develop pipeline never produced them (a
    # very old commit, or a skipped pipeline). That is deliberately a hard error rather than a
    # silent rebuild: publishing an untested artifact is what this change exists to prevent.
    - printf '%s' "$CI_JOB_TOKEN" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export STAGED="$CI_REGISTRY_IMAGE/staging"
    # The commit-scoped alias build:container publishes as its final step, once its smoke, feature
    # and attestation gates have passed. $CI_COMMIT_SHA is the only handle this job shares with the
    # pipeline that did the building — a tag pipeline has its own $CI_PIPELINE_ID, so it cannot name
    # that pipeline's ref.
    #
    # This is what makes a tag a promotion rather than a rebuild: the develop pipeline for this
    # commit built, tested and blessed these manifests, and the tag ships those bytes.
    - export STAGE_REF="$CI_COMMIT_SHA"
    # RESOLVE TO DIGESTS FIRST, then do everything against the digest.
    #
    # `staging:<sha>` is a MUTABLE tag: a branch pipeline, a tag pipeline, or a retry on the same
    # commit rewrites it, and this job is manual so it can sit for a while before running. Verifying
    # a tag and then promoting that same tag is a time-of-check/time-of-use gap — the thing promoted
    # need not be the thing verified. Pinning the digest once closes it: everything below inspects
    # and promotes that exact manifest, whatever happens to the tag meanwhile.
    - |
      set -eu
      : > /tmp/staged_digests
      # The digest is the sha256 of the manifest's own bytes, so hashing `--raw` computes it by
      # definition, for an index or a single manifest alike.
      #
      # Not `--format '{{.Manifest.Digest}}'`, which was here first and never worked: buildx
      # special-cases a template starting with `.Manifest` and prints its full human-readable dump
      # instead, exiting 0. `test -n` sees a non-empty string and passes, so the "digest" carried
      # forward was a 14-line block beginning "Name: ...". An invalid field name is no better —
      # buildx prints `ERROR: template:` and still exits 0.
      for suffix in "" "-devel" "-dpdk" "-dpdk-devel"; do
        src="$STAGED:$STAGE_REF$suffix"
        # Two steps, not a pipeline: a pipeline's status is `sha256sum`'s, which succeeds whatever
        # inspect did. Capturing first is what makes a missing image an error.
        if ! raw="$(docker buildx imagetools inspect "$src" --raw 2>/dev/null)"; then
          echo "MISSING staged image: $src"
          echo "No pipeline for $CI_COMMIT_SHA has staged images. Run a branch pipeline on that"
          echo "commit so build:container blesses them, then re-run this job. Refusing to rebuild"
          echo "and publish an artifact that was never tested."
          exit 1
        fi
        digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
        # A digest is a fixed shape; anything else means the resolution above changed behaviour.
        echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
          || { echo "unparseable digest for $src: [$digest]"; exit 1; }
        printf '%s|%s\n' "$suffix" "$STAGED@$digest" >> /tmp/staged_digests
        echo "resolved $src -> $digest"
      done
      cat /tmp/staged_digests
    # Manifest copy FROM THE PINNED DIGESTS, so the published bytes are the ones resolved and
    # verified above — not whatever the mutable staging tag points at by now.
    - |
      set -eu
      # -F'|' is load-bearing. With awk's default field splitting, leading blanks are discarded, so
      # the runtime line — whose suffix is the EMPTY string — parsed as a single field and
      # digest_for '' returned nothing, silently failing to publish the primary image. An explicit
      # delimiter preserves an empty first field.
      digest_for() {
        awk -F'|' -v s="$1" '$1==s {print $2}' /tmp/staged_digests
      }
      for sfx in "" "-devel" "-dpdk" "-dpdk-devel"; do
        test -n "$(digest_for "$sfx")" || { echo "no staged digest resolved for suffix '$sfx'"; exit 1; }
      done
      docker buildx imagetools create --tag "$RUNTIME_SHA_TAG"      "$(digest_for '')"
      docker buildx imagetools create --tag "$DEVEL_SHA_TAG"        "$(digest_for '-devel')"
      docker buildx imagetools create --tag "$RUNTIME_DPDK_SHA_TAG" "$(digest_for '-dpdk')"
      docker buildx imagetools create --tag "$DEVEL_DPDK_SHA_TAG"   "$(digest_for '-dpdk-devel')"
    # ATTESTATIONS MUST SURVIVE THE CROSS-REGISTRY COPY. Provenance and SBOM are sibling manifests
    # in the image index, so a manifest copy should carry them — but "should" is not verification,
    # and this is the first point where GitLab's registry and Docker Hub have to agree about
    # referrer media types. Gate it here rather than leaving a comment telling someone to check by
    # hand; a silently unattested release is exactly what the staging gate exists to prevent.
    - |
      set -eu
      attested() {
        val="$(docker buildx imagetools inspect "$1" --format "{{json .$2}}" 2>/dev/null || true)"
        val="$(printf '%s' "$val" | tr -d '[:space:]')"
        test -n "$val" && test "$val" != "null" && test "$val" != "{}" && test "$val" != "[]"
      }
      for tag in "$RUNTIME_SHA_TAG" "$DEVEL_SHA_TAG" "$RUNTIME_DPDK_SHA_TAG" "$DEVEL_DPDK_SHA_TAG"; do
        attested "$tag" Provenance || { echo "provenance lost promoting $tag"; exit 1; }
        attested "$tag" SBOM       || { echo "SBOM lost promoting $tag"; exit 1; }
        echo "attested on Docker Hub: $tag"
      done
    # Pull and test the registry manifests before adding release aliases.
    - docker pull "$RUNTIME_SHA_TAG"
    - docker pull "$DEVEL_SHA_TAG"
    - docker pull "$RUNTIME_DPDK_SHA_TAG"
    - docker pull "$DEVEL_DPDK_SHA_TAG"
    - test "$(docker run --rm "$RUNTIME_SHA_TAG" --version)" = "$PROJECT_VERSION"
    - test "$(docker run --rm "$RUNTIME_DPDK_SHA_TAG" --version)" = "$PROJECT_VERSION"
    # Labels carry the numeric PROJECT version; release identity (including -rc.N) is the TAG. See
    # the label contract in build:container. Asserted on the promoted artifacts so a staged image
    # built from a mismatched source tree cannot slip through: the promote is a manifest copy, so
    # whatever develop baked is what ships.
    - |
      set -eu
      for tag in "$RUNTIME_SHA_TAG" "$DEVEL_SHA_TAG" "$RUNTIME_DPDK_SHA_TAG" "$DEVEL_DPDK_SHA_TAG"; do
        got="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$tag")"
        test "$got" = "$PROJECT_VERSION" || { echo "$tag label version=[$got] want [$PROJECT_VERSION]"; exit 1; }
      done
    - docker run --rm --entrypoint /bin/bash "$RUNTIME_SHA_TAG" -c 'test "$(id -u)" = 10001; ! command -v cmake; ! command -v g++'
    - docker run --rm --entrypoint /bin/bash "$RUNTIME_DPDK_SHA_TAG" -c 'test "$(id -u)" = 10001; ! command -v cmake; ! command -v g++'
    - docker run --rm "$DEVEL_SHA_TAG" cmake --version
    - docker run --rm "$DEVEL_DPDK_SHA_TAG" cmake --version
    # CAPABILITY GATE on the REGISTRY-RESOLVED manifests, not just the local build cache. This is
    # what the 0.5.0-rc.1 publication lacked: it verified --version and non-root, both of which an
    # image with every optional feature compiled out passes. Asserted per variant, and the standard
    # images must NOT claim dpdk — a mixed-up build arg would otherwise publish a DPDK-linked image
    # under the plain tag, imposing hugepage and device requirements on everyone who pulls it.
    - |
      set -eu
      std="$(docker run --rm --entrypoint /usr/local/bin/composite-cli "$RUNTIME_SHA_TAG" --features | sort | tr '\n' ',')"
      test "$std" = "openssl,opentelemetry," || { echo "standard runtime features wrong: [$std]"; exit 1; }
      dev="$(docker run --rm --entrypoint /usr/local/bin/composite-cli "$DEVEL_SHA_TAG" --features | sort | tr '\n' ',')"
      test "$dev" = "openssl,opentelemetry," || { echo "standard devel features wrong: [$dev]"; exit 1; }
      dpk="$(docker run --rm --entrypoint /usr/local/bin/composite-cli "$RUNTIME_DPDK_SHA_TAG" --features | sort | tr '\n' ',')"
      test "$dpk" = "dpdk,openssl,opentelemetry," || { echo "dpdk runtime features wrong: [$dpk]"; exit 1; }
      dpd="$(docker run --rm --entrypoint /usr/local/bin/composite-cli "$DEVEL_DPDK_SHA_TAG" --features | sort | tr '\n' ',')"
      test "$dpd" = "dpdk,openssl,opentelemetry," || { echo "dpdk devel features wrong: [$dpd]"; exit 1; }
    - docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION" "$RUNTIME_SHA_TAG"
    - docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION-devel" "$DEVEL_SHA_TAG"
    - docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION-dpdk" "$RUNTIME_DPDK_SHA_TAG"
    - docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION-dpdk-devel" "$DEVEL_DPDK_SHA_TAG"
    - |
      case "$IMAGE_VERSION" in
        *-rc.*) ;;
        *)
          minor="${IMAGE_VERSION%.*}"
          docker buildx imagetools create --tag "$IMAGE_NAME:$minor" "$RUNTIME_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:$minor-devel" "$DEVEL_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$RUNTIME_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:devel" "$DEVEL_SHA_TAG"
          # DPDK moves its own minor aliases but deliberately gets NO bare `latest`/`dpdk-latest`:
          # an unsuffixed floating tag for a variant that needs hugepages and device access is a
          # trap for anyone who pulls it by habit. The suffix has to be asked for explicitly.
          docker buildx imagetools create --tag "$IMAGE_NAME:$minor-dpdk" "$RUNTIME_DPDK_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:$minor-dpdk-devel" "$DEVEL_DPDK_SHA_TAG"
          ;;
      esac
    # Every promoted alias is inspected, DPDK included. An alias that failed to resolve is a
    # published tag nobody can pull, and it should fail the job that created it rather than the
    # first user who tries.
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION"
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION-devel"
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION-dpdk"
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION-dpdk-devel"
  after_script:
    # after_script runs in a fresh shell, so repeat the credential boundary. TWO registries now:
    # Docker Hub for publication and this project's registry for the staged inputs.
    - unset DOCKER_AUTH_CONFIG
    - docker logout 2>/dev/null || true
    - docker logout "$CI_REGISTRY" 2>/dev/null || true
