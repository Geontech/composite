# composite CI — build + test + sanitizers + public framework images.
# See ASSESSMENT.md §10 (foundation) and §11 (concurrency test gate).

stages:
  - lint
  - build
  - sanitize
  - publish

# GCC 14 image; install cmake + git (FetchContent needs git) + nlohmann-json3-dev
# (nlohmann_json is a REQUIRED system dependency — the public JSON type in the
# property API — not a FetchContent fallback; trixie's 3.11.3 meets the floor).
.gcc:
  image: gcc:14
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake git nlohmann-json3-dev
    - cmake --version && g++ --version | head -1

# Docker-in-Docker is isolated to the image jobs. These jobs are deliberately
# untagged: the project's default runners already permit the pinned dind service
# to run privileged and share its TLS client certificates. If that ever stops
# being true the jobs fail at `docker version` rather than routing elsewhere, so
# add a `tags:` entry pointing at a privileged runner instead of relaxing this.
# Keep the client and daemon versions identical to avoid API drift.
.docker:
  image: docker:29.1.3-cli
  services:
    - name: docker:29.1.3-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_DRIVER: "overlay2"
  before_script:
    # The self-managed runner injects its own DOCKER_AUTH_CONFIG with a
    # credsStore entry so it can pull the job/service images. Docker CLI 29
    # also consumes this variable, but its stricter parser only accepts inline
    # auths and aborts Buildx sessions on the runner's credsStore field. The
    # runner has finished pulling images before this shell starts; normal image
    # builds need no credentials, and publish:dockerhub authenticates below
    # with docker login (which writes the job-local config.json).
    - unset DOCKER_AUTH_CONFIG
    - docker version
    # Buildx cannot persist TLS material inherited only through DOCKER_* variables
    # when it creates a container-backed builder. Materialize that endpoint and
    # its client certificates as a Docker context, then bind the builder to it.
    - docker context create composite-dind
    - docker buildx create --name composite-ci --driver docker-container --use composite-dind
    - docker buildx inspect --bootstrap

# ---------------------------------------------------------------------------
# Static analysis / formatting (ASSESSMENT §4.F / §8 Pri-3). The tree is
# clang-format-clean (formatted with the image's clang-format; re-run inside
# gcc:14 if versions disagree locally), so the format gate is mandatory.
# clang-tidy surfaces findings as warnings (WarningsAsErrors is still empty);
# tighten it once the outstanding findings are burned down.
# ---------------------------------------------------------------------------
lint:tidy-format:
  stage: lint
  image: gcc:14
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake git clang-tidy clang-format nlohmann-json3-dev
  script:
    # compile_commands.json drives clang-tidy.
    - cmake -B build -DCOMPOSITE_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build -j"$(nproc)" --target composite >/dev/null   # generate version.hpp etc.
    # clang-tidy every compiled source (recursively); each TU pulls its headers, so the whole
    # tree's headers are analyzed transitively — including properties/ports/buffers, which the old
    # 'include/composite/core/*.hpp' glob excluded. `find` (not `git ls-files`) so untracked files
    # are covered too (much of the tree is currently uncommitted; git ls-files would skip it).
    - clang-tidy -p build $(find src -name '*.cpp')
    # clang-format compliance across the whole tree (again `find`, recursive, untracked-visible).
    - clang-format --dry-run --Werror $(find include src test bench examples -name '*.hpp' -o -name '*.cpp' 2>/dev/null)

# ---------------------------------------------------------------------------
# Build the library + CLI with the unit tests on, and run ctest.
# ---------------------------------------------------------------------------
build:test:
  stage: build
  extends: .gcc
  script:
    # `ci` preset = Debug + tests + COMPOSITE_WERROR=ON: the tree is warning-clean
    # under -Wall -Wextra -Wpedantic, so warnings now fail the gate. ctest runs the
    # full 34-test suite (incl. the formerly-orphaned concurrency tests).
    - cmake --preset ci
    - cmake --build --preset ci -j"$(nproc)"
    - ctest --preset ci

# Build the documented option combinations so the optional-feature paths
# (OpenSSL / OpenTelemetry, etc.) don't rot. DPDK is its own job below (it pulls
# libdpdk via pkg-config, which the base gcc image doesn't carry).
# OpenTelemetry: trixie's opentelemetry-cpp-dev config find_dependency()s absl,
# protobuf, curl and gRPC (incl. the grpc_cpp_plugin binary), so all of them must
# be present for configure to succeed. libssl-dev ships in the base image.
build:options-matrix:
  stage: build
  image: gcc:14
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake git nlohmann-json3-dev
        opentelemetry-cpp-dev libabsl-dev libprotobuf-dev libcurl4-openssl-dev
        libgrpc++-dev protobuf-compiler-grpc
  parallel:
    matrix:
      - OPTS: "-DCOMPOSITE_USE_OPENSSL=ON"
      - OPTS: "-DCOMPOSITE_USE_OPENTELEMETRY=ON"
  script:
    - cmake -B build $OPTS
    - cmake --build build -j"$(nproc)"

# DPDK feature build. dpdk_manager.cpp ONLY compiles under -DCOMPOSITE_USE_DPDK=ON
# (it includes rte_*.h), so it is invisible to every other job and to local dev
# environments without libdpdk. This is the ONLY gate that compile-checks it — the
# EAL-free bookkeeping/locking it delegates to (port_registry) is already unit- and
# TSan-tested in build:test / sanitize:* without a NIC, so this job only needs to
# COMPILE the EAL adapter, not run it (no NIC in CI). pkg_check_modules(libdpdk)
# resolves against libdpdk-dev's pkg-config file (installed below), so this gate is
# mandatory — the manager can't silently rot.
build:dpdk:
  stage: build
  image: gcc:14
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake git pkg-config libdpdk-dev nlohmann-json3-dev
    - cmake --version && pkg-config --modversion libdpdk
  script:
    # Build the library (which now contains dpdk_manager.cpp) + the CLI. Tests off:
    # the DPDK paths need a NIC/hugepages to run; compile coverage is the goal here.
    - cmake -B build -DCOMPOSITE_USE_DPDK=ON -DCOMPOSITE_BUILD_TESTS=OFF -DCOMPOSITE_WERROR=ON
    - cmake --build build -j"$(nproc)"

# Install the package and build a downstream consumer against it via
# find_package(composite). Guards the install/export/pkg-config surface: asserts
# the generated version.hpp installs and the .pc declares Libs: (both were broken
# before the packaging fixes — a $<BUILD_INTERFACE:> in install() and a missing
# Libs: line).
build:consumer:
  stage: build
  extends: .gcc
  script:
    - cmake -B build -DCMAKE_INSTALL_PREFIX=$CI_PROJECT_DIR/_install -DCOMPOSITE_INSTALL=ON -DCOMPOSITE_BUILD_TESTS=OFF
    - cmake --build build -j"$(nproc)" --target install
    - test -f _install/include/composite/version.hpp        # generated header must install
    # composite.pc installs to ${CMAKE_INSTALL_LIBDIR}/pkgconfig (lib or lib64, distro-dependent),
    # not share/pkgconfig — locate it instead of hardcoding the libdir.
    - grep -q '^Libs:' "$(find _install -name composite.pc)" # .pc must declare Libs
    - mkdir -p consumer
    - |
      cat > consumer/main.cpp <<'EOF'
      // Include the umbrella header (pulls component.hpp etc.) to ENFORCE self-containment:
      // the installed package must compile against a clean consumer with no spdlog on the
      // include path (spdlog is private behind composite::logger; nlohmann_json is a public
      // find_dependency). A subclass + logger() exercise the logging facade end to end.
      #include <composite/composite.hpp>
      namespace {
      class ci_probe : public composite::component {
      public:
          explicit ci_probe(std::string_view id) : composite::component(id) {}
          auto process() -> composite::retval override { logger()->info("ci {}", id()); return composite::retval::FINISH; }
      };
      }
      int main() {
          composite::set_global_log_level(composite::log_level::off);
          auto& r = composite::metrics::registry::instance();
          r.get_or_create_counter("ci.consumer", "demo", "1", {}).inc();
          ci_probe p{"ci_consumer"};
          return 0;
      }
      EOF
    - |
      cat > consumer/CMakeLists.txt <<'EOF'
      cmake_minimum_required(VERSION 3.16)
      project(consumer CXX)
      set(CMAKE_CXX_STANDARD 20)
      find_package(composite REQUIRED)
      add_executable(consumer main.cpp)
      target_link_libraries(consumer PRIVATE composite::composite)
      EOF
    - cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install
    - cmake --build consumer/build
    - LD_LIBRARY_PATH=$CI_PROJECT_DIR/_install/lib consumer/build/consumer
    # Build the in-repo example component against the install so the README's "Implementing a
    # Component" walkthrough stays compilable (it is the same source as examples/passthrough_gain).
    - cmake -S examples/passthrough_gain -B examples/passthrough_gain/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install
    - cmake --build examples/passthrough_gain/build
    - test -f "$(find examples/passthrough_gain/build -name 'libpassthrough_gain.so')"  # MODULE .so built

# Build and exercise both public framework image roles. This job never receives
# Docker Hub credentials and never pushes: merge-request/branch pipelines only
# prove the packaging contract. The CI-only targets validate an installed SDK
# consumer and graceful signal handling without adding test assets to runtime.
build:container:
  stage: build
  extends: .docker
  script:
    - export IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - export IMAGE_VERSION="$(sed -n 's/^project(composite VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
    - test -n "$IMAGE_VERSION"
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-runtime
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-devel
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel-smoke
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-devel-smoke
      --load
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime-smoke
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag composite:ci-runtime-smoke
      --load
      .
    - test "$(docker image inspect --format '{{.Config.User}}' composite:ci-runtime)" = "10001:10001"
    - test "$(docker run --rm composite:ci-runtime --version)" = "$IMAGE_VERSION"
    # The Rocky base's own labels are inherited and can only be overwritten, so
    # assert the restated values survive on both roles — an unnoticed base-image
    # bump reintroducing `license=BSD-3-Clause` would misdescribe an LGPL image.
    - |
      set -eu
      for role in runtime devel; do
        img="composite:ci-$role"
        test "$(docker image inspect --format '{{index .Config.Labels "license"}}' "$img")" = "LGPL-3.0-or-later"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$img")" = "LGPL-3.0-or-later"
        test "$(docker image inspect --format '{{index .Config.Labels "vendor"}}' "$img")" = "Geon Technologies, LLC"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.vendor"}}' "$img")" = "Geon Technologies, LLC"
        test "$(docker image inspect --format '{{index .Config.Labels "version"}}' "$img")" = "$IMAGE_VERSION"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$img")" = "$IMAGE_VERSION"
      done
    # Both images redistribute the header-only dependencies' code, so their MIT
    # notices must ship with them.
    - |
      set -eu
      for role in runtime devel; do
        docker run --rm --entrypoint /bin/bash "composite:ci-$role" -c '
          set -eu
          for dep in argparse cpp-httplib spdlog nlohmann_json; do
            ls /usr/share/licenses/composite/third-party/"$dep"/* >/dev/null
          done
          test -s /usr/share/licenses/composite/LICENSE'
      done
    - docker run --rm --entrypoint /bin/bash composite:ci-runtime -c 'test "$(id -u)" = 10001; ! command -v cmake; ! command -v g++; test ! -e /usr/local/include/composite'
    - docker run --rm composite:ci-devel cmake --version
    - docker run --rm composite:ci-devel /bin/bash -c 'test "$(id -u)" = 10001; test -f /usr/local/include/composite/composite.hpp; test -f /usr/local/share/composite/cmake/compositeConfig.cmake'
    - docker run --rm composite:ci-devel-smoke /bin/true
    - docker run --detach --name composite-runtime-smoke composite:ci-runtime-smoke
    - |
      ready=0
      for attempt in $(seq 1 40); do
        if docker logs composite-runtime-smoke 2>&1 | grep -q 'REST server listening'; then
          ready=1
          break
        fi
        sleep 0.25
      done
      test "$ready" = 1
    - docker kill --signal TERM composite-runtime-smoke
    - test "$(docker wait composite-runtime-smoke)" = 0
  after_script:
    # after_script runs in a fresh shell, so repeat the credential boundary.
    - unset DOCKER_AUTH_CONFIG
    - docker rm -f composite-runtime-smoke 2>/dev/null || true

# Build the sibling composite-comps fleet against the freshly-installed framework
# and run its integration tests — the §6 per-stage exit gate, now that the fleet
# is migrated to the new APIs (all 5 components build; framer tests pass). Defaults
# to a sibling project in the same group; allow_failure only until the repo's CI
# access is provisioned (the build itself is green).
build:comps:
  stage: build
  extends: .gcc
  allow_failure: true   # pending comps-repo CI access; the build + tests are green locally
  variables:
    COMPS_REPO_URL: "$CI_SERVER_URL/$CI_PROJECT_NAMESPACE/composite-comps.git"
  script:
    - cmake -B build -DCMAKE_INSTALL_PREFIX=$CI_PROJECT_DIR/_install -DCOMPOSITE_INSTALL=ON -DCOMPOSITE_BUILD_TESTS=OFF
    - cmake --build build -j"$(nproc)" --target install
    - git clone --depth 1 "$COMPS_REPO_URL" comps_src
    - cmake -S comps_src -B comps_src/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install -DBUILD_TESTING=ON
    - cmake --build comps_src/build -j"$(nproc)"                       # all 5 component .so
    - cmake --build comps_src/build --target framer_integration_tests  # fleet integration test
    - ctest --test-dir comps_src/build -R framer_integration --output-on-failure
    - cmake -S comps_src -B comps_src/build -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/_install

# ---------------------------------------------------------------------------
# Sanitizer gate for the concurrency core + buffers (ASSESSMENT §11).
#
# These now drive the CMake `tsan` / `asan-ubsan` presets — a single source of
# truth shared with local dev (`cmake --preset tsan && ctest --preset tsan`).
# The presets apply -fsanitize at directory scope, so the WHOLE registered
# suite is instrumented (the 13 formerly-orphaned standalone tests are now
# proper CMake targets), not just a hand-picked set of g++ one-liners. The test
# presets carry the TSAN_OPTIONS/UBSAN_OPTIONS halt_on_error settings.
# ---------------------------------------------------------------------------
sanitize:thread:
  stage: sanitize
  extends: .gcc
  script:
    - cmake --preset tsan
    - cmake --build --preset tsan -j"$(nproc)"
    # Concurrency core + ports + lifecycle + standalone suite. The httplib-based
    # integration test is excluded until httplib itself is confirmed TSan-clean
    # (third-party); drop the -E to include it once verified.
    - ctest --preset tsan -E TestHttpIntegration

sanitize:address:
  stage: sanitize
  extends: .gcc
  script:
    - cmake --preset asan-ubsan
    - cmake --build --preset asan-ubsan -j"$(nproc)"
    - ctest --preset asan-ubsan

# Weak-memory (ARM) run: x86 TSO hides the visibility bugs the park
# happens-before chain guards against (ASSESSMENT §11, T-A/T-C). Requires an
# aarch64 runner; left allow_failure until one is wired up.
sanitize:thread-arm64:
  stage: sanitize
  extends: .gcc
  tags: [arm64]
  allow_failure: true
  script:
    - cmake --preset tsan
    - cmake --build --preset tsan -j"$(nproc)"
    - ctest --preset tsan -E TestHttpIntegration

# Build each release image once, push it under its source-SHA tag with SBOM and
# max provenance, test the registry-resolved artifacts, then promote those same
# manifests to SemVer aliases. This is initially manual even on a protected
# release tag; the protected environment supplies the approval/audit boundary.
publish:dockerhub:
  stage: publish
  extends: .docker
  resource_group: dockerhub-composite
  environment:
    name: dockerhub-production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
      when: manual
    - when: never
  script:
    - test -n "$DOCKERHUB_NAMESPACE"
    - test -n "$DOCKERHUB_LOGIN"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DOCKERHUB_REPOSITORY"
    - export IMAGE_NAME="$DOCKERHUB_NAMESPACE/$DOCKERHUB_REPOSITORY"
    - export IMAGE_VERSION="${CI_COMMIT_TAG#v}"
    - export PROJECT_VERSION="$(sed -n 's/^project(composite VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
    # An RC image keeps its full prerelease tag, while CMake and composite-cli
    # report the underlying numeric project version.
    - export RELEASE_BASE_VERSION="${IMAGE_VERSION%%-rc.*}"
    - test "$RELEASE_BASE_VERSION" = "$PROJECT_VERSION"
    - export IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - export RUNTIME_SHA_TAG="$IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA"
    - export DEVEL_SHA_TAG="$IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA-devel"
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_LOGIN" --password-stdin
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target runtime
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag "$RUNTIME_SHA_TAG"
      --provenance=mode=max
      --sbom=true
      --push
      .
    - >-
      docker buildx build
      --file docker/Dockerfile.rocky9
      --platform linux/amd64
      --target devel
      --build-arg IMAGE_CREATED="$IMAGE_CREATED"
      --build-arg IMAGE_REVISION="$CI_COMMIT_SHA"
      --build-arg IMAGE_VERSION="$IMAGE_VERSION"
      --build-arg IMAGE_SOURCE="$CI_PROJECT_URL"
      --tag "$DEVEL_SHA_TAG"
      --provenance=mode=max
      --sbom=true
      --push
      .
    # Pull and test the registry manifests before adding release aliases.
    - docker pull "$RUNTIME_SHA_TAG"
    - docker pull "$DEVEL_SHA_TAG"
    - test "$(docker run --rm "$RUNTIME_SHA_TAG" --version)" = "$PROJECT_VERSION"
    - docker run --rm --entrypoint /bin/bash "$RUNTIME_SHA_TAG" -c 'test "$(id -u)" = 10001; ! command -v cmake; ! command -v g++'
    - docker run --rm "$DEVEL_SHA_TAG" cmake --version
    - docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION" "$RUNTIME_SHA_TAG"
    - docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION-devel" "$DEVEL_SHA_TAG"
    - |
      case "$IMAGE_VERSION" in
        *-rc.*) ;;
        *)
          minor="${IMAGE_VERSION%.*}"
          docker buildx imagetools create --tag "$IMAGE_NAME:$minor" "$RUNTIME_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:$minor-devel" "$DEVEL_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$RUNTIME_SHA_TAG"
          docker buildx imagetools create --tag "$IMAGE_NAME:devel" "$DEVEL_SHA_TAG"
          ;;
      esac
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION"
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_VERSION-devel"
  after_script:
    # after_script runs in a fresh shell, so repeat the credential boundary.
    - unset DOCKER_AUTH_CONFIG
    - docker logout 2>/dev/null || true
